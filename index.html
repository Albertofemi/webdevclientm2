<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Odyssey · Recipe finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <h1>Async Odyssey</h1>
      <p class="lede">Find a recipe. Every request is fetched once, then remembered.</p>
      <form id="search-form" role="search">
        <label for="search" class="sr-only">Search meals by name</label>
        <input id="search" type="search" placeholder="Search meals, e.g. arrabiata" autocomplete="off" />
        <label for="sort" class="sr-only">Sort order</label>
        <select id="sort">
          <option value="asc">A to Z</option>
          <option value="desc">Z to A</option>
        </select>
      </form>
      <nav id="categories" aria-label="Categories"></nav>
    </header>

    <main>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="grid" class="grid" aria-label="Meals"></section>
    </main>

    <footer class="foot">
      <span id="source"></span>
      <span id="cache-info"></span>
      <button id="clear-cache" type="button">Clear cache</button>
    </footer>

    <dialog id="detail" aria-labelledby="detail-title"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
